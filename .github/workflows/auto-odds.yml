name: Auto-update odds & prediction markets

# Replaces the Mac mini cron (update-odds.sh + fetch-polymarket.js), retired 7 Sep 2026.
on:
  schedule:
    - cron: "0 4,16 * * *"    # live odds: 06:00 + 18:00 SAST
    - cron: "5 */6 * * *"     # Polymarket + Kalshi: every 6h (00:05, 06:05, 12:05, 18:05 UTC)
  workflow_dispatch:
    inputs:
      job:
        description: Which update to run
        type: choice
        options: [both, odds, markets]
        default: both

permissions:
  contents: write   # commit + push data
  actions: write    # dispatch pages.yml (GITHUB_TOKEN pushes don't trigger push workflows)

concurrency:
  group: auto-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide what to run
        id: plan
        run: |
          odds=false; markets=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.job }}" in
              odds) odds=true ;;
              markets) markets=true ;;
              *) odds=true; markets=true ;;
            esac
          elif [ "${{ github.event.schedule }}" = "0 4,16 * * *" ]; then
            odds=true
          else
            markets=true
          fi
          # SAST hour decides morning/evening label
          hour=$(TZ=Africa/Johannesburg date +%H)
          if [ "$hour" -lt 12 ]; then slot=morning; else slot=evening; fi
          echo "odds=$odds" >> "$GITHUB_OUTPUT"
          echo "markets=$markets" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Fetch live odds (The Odds API)
        if: steps.plan.outputs.odds == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "::error::ODDS_API_KEY secret is not set"; exit 1; fi
          node fetch-live-odds.js 2>&1 | tee odds.log
          if grep -qiE "OUT_OF_USAGE_CREDITS|quota|Usage quota" odds.log; then
            echo "::error::The Odds API quota exhausted"; exit 1
          fi
          if grep -q "No games with odds found" odds.log; then
            echo "::warning::Odds API returned no games with odds; existing data kept"
          fi
          rm -f odds.log

      - name: Commit live odds
        if: steps.plan.outputs.odds == 'true'
        run: |
          git add index.html best-odds-finder.html data/live-odds.json data/odds-history.json
          if git diff --cached --quiet; then echo "No odds changes"; else
            git commit -m "Auto: Update live odds (${{ steps.plan.outputs.slot }})"
          fi

      - name: Fetch Polymarket
        if: steps.plan.outputs.markets == 'true'
        run: node fetch-polymarket.js

      - name: Fetch Kalshi
        if: steps.plan.outputs.markets == 'true'
        run: node fetch-kalshi.js

      - name: Commit prediction markets
        if: steps.plan.outputs.markets == 'true'
        run: |
          git add data/polymarket.json data/kalshi.json
          if git diff --cached --quiet; then echo "No market changes"; else
            git commit -m "Auto: Refresh Polymarket + Kalshi prediction market data"
          fi

      - name: Push and trigger Pages deploy
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "Nothing to push"; exit 0
          fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && pushed=1 && break
            sleep 5
          done
          [ -n "$pushed" ] || { echo "::error::Push failed"; exit 1; }
          # Pushes made with GITHUB_TOKEN don't fire `on: push`, but workflow_dispatch is allowed.
          gh workflow run pages.yml --ref main
