name: Weekly operator licence audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

jobs:
  licence-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh NGB register snapshot
        run: node scripts/fetch-ngb-register.mjs

      - name: Run operator licence check
        run: node tests/assert-operator-licences.mjs

      - name: Upload NGB register snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngb-register
          path: data/ngb-register.json
