<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affiliate Tracker — BetSorted (Private)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#0b1220; color:#e5e7eb; margin:0; padding:24px; }
    h1 { font-size:22px; margin:0 0 6px; }
    .muted { color:#9ca3af; font-size:12px; }
    table { width:100%; border-collapse: collapse; margin-top:16px; }
    th, td { padding:10px; border-bottom:1px solid #1f2937; text-align:left; font-size:13px; }
    th { color:#93c5fd; font-weight:600; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:11px; }
    .signed { background:#065f46; color:#d1fae5; }
    .planned { background:#1f2937; color:#cbd5e1; }
    a { color:#93c5fd; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>

  <!-- Phase 1 additive schema -->
  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://betsorted.co.za/#organization",
      "name": "BetSorted",
      "url": "https://betsorted.co.za/",
      "logo": "https://betsorted.co.za/assets/betsorted-logo.png"
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://betsorted.co.za/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "private",
          "item": "https://betsorted.co.za/private"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Affiliate Tracker",
          "item": "https://betsorted.co.za/private/affiliate-tracker.html"
        }
      ]
    }
  ]
}
  </script>
</head>
<body>
  <h1>Affiliate Tracker</h1>
  <div class="muted">Private • last updated: <span id="updated">—</span></div>

  <table>
    <thead>
      <tr>
        <th>Brand</th>
        <th>Status</th>
        <th>Program</th>
        <th>Affiliate Link</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    async function load() {
      const res = await fetch('/private/affiliates.json?v=' + Date.now());
      const data = await res.json();
      document.getElementById('updated').textContent = data.updated || '—';
      const rows = document.getElementById('rows');
      rows.innerHTML = data.affiliates.map(a => `
        <tr>
          <td>${a.name}</td>
          <td><span class="badge ${a.status === 'Signed up' ? 'signed' : 'planned'}">${a.status}</span></td>
          <td>${a.program_url ? `<a href="${a.program_url}" target="_blank">Program</a>` : '—'}</td>
          <td>${a.affiliate_link ? `<a href="${a.affiliate_link}" target="_blank">Link</a>` : '—'}</td>
          <td>${a.notes || ''}</td>
        </tr>
      `).join('');
    }
    load();
  </script>
</body>
</html>
