<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetSorted Ops Board (Private)</title>
  <link rel="icon" href="/assets/favicon.png">
  <style>
    body{font-family:Inter,system-ui,Arial,sans-serif;background:#0b1220;color:#e5e7eb;margin:0;padding:24px}
    h1{font-size:24px;margin:0 0 8px}
    .muted{color:#9ca3af;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;margin-top:16px}
    .col{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px;min-height:180px}
    .col h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd;margin:0 0 10px}
    .card{background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:10px;margin:8px 0}
    .card .title{font-weight:600}
    .card .meta{font-size:12px;color:#9ca3af;margin-top:6px}
    .path-copy{background:#0f172a;border:1px solid #374151;border-radius:6px;padding:6px 10px;font-size:11px;font-family:Monaco,monospace;color:#93c5fd;cursor:pointer;display:inline-block;margin-right:8px;margin-top:4px}
    .path-copy:hover{background:#1e293b;border-color:#4b5563}
    .path-copy:active{background:#0f172a}
    .section{margin-top:24px}
    .tweets{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    pre{white-space:pre-wrap;background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:10px;color:#e5e7eb}
    .empty{color:#6b7280;font-size:13px}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <h1>BetSorted Ops Board (Private)</h1>
  <div class="muted">Private link • last updated: <span id="updated">—</span></div>
  <div style="margin:12px 0;padding:10px 12px;background:#1e293b;border:1px solid #334155;border-radius:8px;font-size:12px;color:#cbd5e1;">
    💡 <strong>For best results:</strong> Access via <a href="http://localhost:8765/private/kanban.html" style="color:#93c5fd;">http://localhost:8765/private/kanban.html</a> (one-click opens Finder)
  </div>

  <div id="quickLinks" style="margin:16px 0;padding:12px;background:#111827;border:1px solid #1f2937;border-radius:12px;"></div>

  <div class="grid" id="kanban"></div>

  <div class="section" id="personal-section" style="display:none;">
    <h2 id="personal-title" style="color:#93c5fd;margin:0 0 8px;">Personal Board</h2>
    <div class="grid" id="personal-kanban"></div>
  </div>

  <div class="section">
    <h2>Tweets Library</h2>
    <div class="tweets">
      <div>
        <h3>BetSorted</h3>
        <div id="tweets-betsorted"></div>
      </div>
      <div>
        <h3>CryptoCasinoSorted</h3>
        <div id="tweets-ccs"></div>
      </div>
    </div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/private/board.json?v=' + Date.now());
      const data = await res.json();
      document.getElementById('updated').textContent = data.updated || '—';
      
      // Render quick links
      if (data.quickLinks) {
        const ql = document.getElementById('quickLinks');
        ql.innerHTML = '<h3 style="margin:0 0 8px;font-size:14px;color:#93c5fd;">📁 Quick Access (click to copy path)</h3>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
          Object.entries(data.quickLinks).map(([key, url]) => {
            const path = url.replace('file://', '');
            return `<div class="path-copy" onclick="openPath('${path}', this)" title="Click to open in Finder">${key}</div>`;
          }).join('') +
          '</div>' +
          '<div style="margin-top:8px;font-size:11px;color:#9ca3af;">💡 Click to open in Finder. If blocked, it will fall back to copy.</div>';
      }
      
      const kb = document.getElementById('kanban');
      kb.innerHTML = '';
      data.columns.forEach(col => {
        const el = document.createElement('div');
        el.className = 'col';
        el.innerHTML = `<h2>${col.title}</h2>` + (col.items.length ? col.items.map(i => {
          let linksHtml = '';
          if (i.links && i.links.length) {
            linksHtml = '<div style="margin-top:8px;">' + 
              i.links.map(link => {
                if (link.url.startsWith('file://')) {
                  const path = link.url.replace('file://', '');
                  return `<div class="path-copy" onclick="openPath('${path}', this)" title="Click to open in Finder">📁 ${link.label}</div>`;
                } else {
                  return `<a href="${link.url}" target="_blank" style="margin-right:8px;font-size:11px;color:#93c5fd;">🔗 ${link.label}</a>`;
                }
              }).join('') + 
              '</div>';
          }
          return `
          <div class="card">
            <div class="title">${i.title}</div>
            ${i.body ? `<div class="meta">${i.body}</div>` : ''}
            ${i.meta ? `<div class="meta">${i.meta}</div>` : ''}
            ${linksHtml}
          </div>`;
        }).join('') : `<div class="empty">No items yet</div>`);
        kb.appendChild(el);
      });

      // Render personal board
      if (data.personal && data.personal.columns) {
        const section = document.getElementById('personal-section');
        const pk = document.getElementById('personal-kanban');
        const pt = document.getElementById('personal-title');
        if (data.personal.title) pt.textContent = data.personal.title;
        section.style.display = 'block';
        pk.innerHTML = '';
        data.personal.columns.forEach(col => {
          const el = document.createElement('div');
          el.className = 'col';
          el.innerHTML = `<h2>${col.title}</h2>` + (col.items.length ? col.items.map(i => {
            let linksHtml = '';
            if (i.links && i.links.length) {
              linksHtml = '<div style="margin-top:8px;">' + 
                i.links.map(link => {
                  if (link.url.startsWith('file://')) {
                    const path = link.url.replace('file://', '');
                    return `<div class="path-copy" onclick="openPath('${path}', this)" title="Click to open in Finder">📁 ${link.label}</div>`;
                  } else {
                    return `<a href="${link.url}" target="_blank" style="margin-right:8px;font-size:11px;color:#93c5fd;">🔗 ${link.label}</a>`;
                  }
                }).join('') + 
                '</div>';
            }
            return `
            <div class="card">
              <div class="title">${i.title}</div>
              ${i.body ? `<div class="meta">${i.body}</div>` : ''}
              ${i.meta ? `<div class="meta">${i.meta}</div>` : ''}
              ${linksHtml}
            </div>`;
          }).join('') : `<div class="empty">No items yet</div>`);
          pk.appendChild(el);
        });
      }

      function renderTweets(container, items){
        if(!items || !items.length){
          container.innerHTML = `<div class=\"empty\">No tweets yet</div>`;
          return;
        }
        container.innerHTML = items.map(t => {
          if (typeof t === 'string') return `<pre>${t}</pre>`;
          return `<pre><strong>${t.time}</strong> — ${t.text}</pre>`;
        }).join('');
      }

      renderTweets(document.getElementById('tweets-betsorted'), data.tweets.betsorted);
      renderTweets(document.getElementById('tweets-ccs'), data.tweets.cryptocasinosorted);
    }

    function openPath(path, element) {
      // Try to open via local helper server
      fetch(`http://localhost:8766/open?path=${encodeURIComponent(path)}`)
        .then(res => {
          if (res.ok) {
            const original = element.innerHTML;
            element.innerHTML = '✓ Opened!';
            element.style.background = '#065f46';
            element.style.borderColor = '#059669';
            setTimeout(() => {
              element.innerHTML = original;
              element.style.background = '#0f172a';
              element.style.borderColor = '#374151';
            }, 1500);
          } else {
            // Fallback to copy
            showPathModal(path);
          }
        })
        .catch(() => {
          // Fallback to copy
          showPathModal(path);
        });
    }

    function showPathModal(path) {
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;';
      modal.innerHTML = `
        <div style="background:#111827;border:1px solid #374151;border-radius:12px;padding:24px;max-width:600px;width:90%;">
          <h3 style="margin:0 0 12px;color:#93c5fd;">📁 Copy this path:</h3>
          <input type="text" value="${path}" readonly 
            style="width:100%;padding:12px;background:#0f172a;border:1px solid #374151;border-radius:6px;color:#e5e7eb;font-family:Monaco,monospace;font-size:12px;margin-bottom:16px;"
            onclick="this.select()" id="pathInput">
          <div style="display:flex;gap:8px;">
            <button onclick="document.getElementById('pathInput').select();document.execCommand('copy');this.innerHTML='✓ Copied!';setTimeout(()=>this.closest('div').parentElement.parentElement.remove(),800);" 
              style="flex:1;padding:10px;background:#6366f1;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Copy to Clipboard</button>
            <button onclick="this.closest('div').parentElement.parentElement.remove();" 
              style="padding:10px 20px;background:#374151;color:white;border:none;border-radius:6px;cursor:pointer;">Close</button>
          </div>
          <div style="margin-top:12px;font-size:11px;color:#9ca3af;">💡 Then: Cmd+Shift+G in Finder → Paste → Enter</div>
        </div>
      `;
      document.body.appendChild(modal);
      modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
      setTimeout(() => document.getElementById('pathInput').select(), 100);
    }

    load();
  </script>
</body>
</html>
