<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetSorted Ops Board (Private)</title>
  <link rel="icon" href="/assets/favicon.png">
  <style>
    body{font-family:Inter,system-ui,Arial,sans-serif;background:#0b1220;color:#e5e7eb;margin:0;padding:24px}
    h1{font-size:24px;margin:0 0 8px}
    .muted{color:#9ca3af;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;margin-top:16px}
    .col{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px;min-height:180px}
    .col h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd;margin:0 0 10px}
    .card{background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:10px;margin:8px 0}
    .card .title{font-weight:600}
    .card .meta{font-size:12px;color:#9ca3af;margin-top:6px}
    .section{margin-top:24px}
    .tweets{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    pre{white-space:pre-wrap;background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:10px;color:#e5e7eb}
    .empty{color:#6b7280;font-size:13px}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <h1>BetSorted Ops Board (Private)</h1>
  <div class="muted">Private link • last updated: <span id="updated">—</span></div>

  <div class="grid" id="kanban"></div>

  <div class="section">
    <h2>Tweets Library</h2>
    <div class="tweets">
      <div>
        <h3>BetSorted</h3>
        <div id="tweets-betsorted"></div>
      </div>
      <div>
        <h3>CryptoCasinoSorted</h3>
        <div id="tweets-ccs"></div>
      </div>
    </div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/private/board.json');
      const data = await res.json();
      document.getElementById('updated').textContent = data.updated || '—';
      const kb = document.getElementById('kanban');
      kb.innerHTML = '';
      data.columns.forEach(col => {
        const el = document.createElement('div');
        el.className = 'col';
        el.innerHTML = `<h2>${col.title}</h2>` + (col.items.length ? col.items.map(i => `
          <div class="card">
            <div class="title">${i.title}</div>
            ${i.body ? `<div class="meta">${i.body}</div>` : ''}
            ${i.meta ? `<div class="meta">${i.meta}</div>` : ''}
          </div>`).join('') : `<div class="empty">No items yet</div>`);
        kb.appendChild(el);
      });

      function renderTweets(container, items){
        if(!items || !items.length){
          container.innerHTML = `<div class="empty">No tweets yet</div>`;
          return;
        }
        container.innerHTML = items.map(t => `<pre>${t}</pre>`).join('');
      }

      renderTweets(document.getElementById('tweets-betsorted'), data.tweets.betsorted);
      renderTweets(document.getElementById('tweets-ccs'), data.tweets.cryptocasinosorted);
    }
    load();
  </script>
</body>
</html>
