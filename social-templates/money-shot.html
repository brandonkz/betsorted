<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: 'Arial Black', Arial, sans-serif; background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.bg-glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); opacity: 0.3; }
.glow-red { background: #ff0000; top: -100px; left: 100px; }
.glow-green { background: #00ff88; bottom: -100px; right: 100px; }
.top-text { color: #888; font-size: 28px; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; z-index: 2; }
.money-row { display: flex; align-items: center; gap: 40px; z-index: 2; }
.amount { font-size: 140px; font-weight: 900; }
.amount-before { color: #ff4444; text-decoration: line-through; text-decoration-thickness: 6px; opacity: 0.7; }
.amount-after { color: #00ff88; text-shadow: 0 0 40px rgba(0, 255, 136, 0.4); }
.arrow { font-size: 80px; color: #ffd700; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.bottom-text { color: #fff; font-size: 32px; margin-top: 30px; z-index: 2; font-weight: 900; }
.subtitle { color: #ffd700; font-size: 22px; margin-top: 10px; z-index: 2; }
.branding { position: absolute; bottom: 20px; right: 30px; color: #555; font-size: 16px; z-index: 2; }
.tag { position: absolute; top: 25px; left: 25px; background: #ff0000; color: #fff; font-size: 16px; font-weight: 900; padding: 8px 20px; border-radius: 6px; z-index: 2; }
</style>
