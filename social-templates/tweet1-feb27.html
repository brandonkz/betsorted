<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: 'Arial Black', Arial, sans-serif; background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.bg-glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); opacity: 0.3; }
.glow-red { background: #ff0000; top: -100px; left: 100px; }
.glow-green { background: #00ff88; bottom: -100px; right: 100px; }
.tag { position: absolute; top: 25px; left: 25px; background: #ff0000; color: #fff; font-size: 18px; font-weight: 900; padding: 10px 24px; border-radius: 6px; z-index: 2; }
.match { color: #888; font-size: 24px; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px; z-index: 2; }
.title { color: #fff; font-size: 48px; font-weight: 900; text-align: center; z-index: 2; margin-bottom: 30px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 15px; z-index: 2; }
.book { text-align: center; padding: 20px 25px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
.book.best { border: 2px solid #00ff88; background: rgba(0,255,136,0.1); }
.book.worst { border: 2px solid #ff4444; background: rgba(255,68,68,0.1); }
.book-name { color: #aaa; font-size: 16px; margin-bottom: 8px; }
.book-odds { font-size: 48px; font-weight: 900; }
.best .book-odds { color: #00ff88; }
.worst .book-odds { color: #ff4444; }
.book:not(.best):not(.worst) .book-odds { color: #fff; }
.book-label { font-size: 14px; margin-top: 8px; font-weight: 900; }
.best .book-label { color: #00ff88; }
.worst .book-label { color: #ff4444; }
.bottom { color: #ffd700; font-size: 28px; font-weight: 900; margin-top: 30px; z-index: 2; }
.branding { position: absolute; bottom: 20px; right: 30px; color: #555; font-size: 16px; z-index: 2; }
</style>
</head>
<body>
  <div class="bg-glow glow-red"></div>
  <div class="bg-glow glow-green"></div>
  <div class="tag">SAME MATCH. 5 DIFFERENT PAYOUTS.</div>
  <div class="match">⚽ Premier League · Tonight 10PM</div>
  <div class="title">Wolves vs Aston Villa · Home Win</div>
  <div class="grid">
    <div class="book best">
      <div class="book-name">Smarkets</div>
      <div class="book-odds">4.50</div>
      <div class="book-label">BEST</div>
    </div>
    <div class="book best">
      <div class="book-name">Betfair</div>
      <div class="book-odds">4.50</div>
      <div class="book-label">BEST</div>
    </div>
    <div class="book best">
      <div class="book-name">Matchbook</div>
      <div class="book-odds">4.50</div>
      <div class="book-label">BEST</div>
    </div>
    <div class="book worst">
      <div class="book-name">Coolbet</div>
      <div class="book-odds">4.40</div>
      <div class="book-label">WORST</div>
    </div>
    <div class="book">
      <div class="book-name">Your bookie?</div>
      <div class="book-odds">???</div>
      <div class="book-label"></div>
    </div>
  </div>
  <div class="bottom">R100 bet = R10 difference. Every. Single. Match.</div>
  <div class="branding">betsorted.co.za</div>
</body>
</html>
