<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: 'Arial Black', Arial, sans-serif; background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.bg-glow { position: absolute; width: 500px; height: 500px; border-radius: 50%; filter: blur(150px); opacity: 0.25; }
.glow1 { background: #ff0000; top: -150px; right: 50px; }
.glow2 { background: #ffd700; bottom: -150px; left: 50px; }
.tag { position: absolute; top: 25px; left: 25px; background: #ff0000; color: #fff; font-size: 18px; font-weight: 900; padding: 10px 24px; border-radius: 6px; z-index: 2; }
.match { color: #888; font-size: 22px; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 15px; z-index: 2; }
.title { color: #fff; font-size: 44px; font-weight: 900; text-align: center; z-index: 2; margin-bottom: 25px; }
.comparison { display: flex; align-items: center; gap: 50px; z-index: 2; }
.side { text-align: center; }
.side-label { color: #888; font-size: 20px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }
.side-odds { font-size: 120px; font-weight: 900; }
.worst .side-odds { color: #ff4444; text-decoration: line-through; text-decoration-thickness: 6px; opacity: 0.7; }
.best .side-odds { color: #00ff88; text-shadow: 0 0 40px rgba(0,255,136,0.4); }
.side-book { font-size: 24px; margin-top: 8px; }
.worst .side-book { color: #ff4444; }
.best .side-book { color: #00ff88; }
.arrow { font-size: 80px; color: #ffd700; }
.bottom { color: #fff; font-size: 30px; font-weight: 900; margin-top: 30px; z-index: 2; }
.sub { color: #ffd700; font-size: 22px; margin-top: 12px; z-index: 2; }
.branding { position: absolute; bottom: 20px; right: 30px; color: #555; font-size: 16px; z-index: 2; }
</style>

<body>
  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>
  <div class="tag">LEEDS WIN ODDS GAP</div>
  <div class="match">⚽ Leeds vs Man City · Sat 7:30PM</div>
  <div class="title">Same bet. R63 difference per R100.</div>
  <div class="comparison">
    <div class="side worst">
      <div class="side-label">Worst odds</div>
