* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; display: flex; font-family: 'Arial Black', Arial, sans-serif; background: #0a0a0a; overflow: hidden; }

.vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; background: #ffd700; color: #000; font-size: 48px; font-weight: 900; width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }

.left .odds-value { color: #4a9eff; }
.right .odds-value { color: #ff4a4a; }
.winner .odds-value { color: #00ff88; text-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
.match-info { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); padding: 10px 30px; border-radius: 30px; color: #aaa; font-size: 18px; z-index: 10; white-space: nowrap; }
.label { color: #888; font-size: 22px; text-transform: uppercase; letter-spacing: 3px; }
.winner-badge { background: #00ff88; color: #000; font-size: 18px; font-weight: 900; padding: 8px 24px; border-radius: 30px; position: absolute; bottom: 30px; }
.branding { position: absolute; bottom: 15px; right: 20px; color: #555; font-size: 14px; z-index: 10; }
.glow-line { position: absolute; left: 50%; top: 0; width: 3px; height: 100%; background: linear-gradient(to bottom, transparent, #ffd700, transparent); z-index: 5; }
</style>
