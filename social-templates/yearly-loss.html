<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; font-family: 'Arial Black', Arial, sans-serif; background: #0a0a0a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.bg-red { position: absolute; width: 800px; height: 800px; border-radius: 50%; background: #ff0000; filter: blur(250px); opacity: 0.12; }
.top-label { font-size: 24px; color: #ff4444; z-index: 2; text-transform: uppercase; letter-spacing: 8px; margin-bottom: 5px; }
.main-number { font-size: 220px; font-weight: 900; color: #ff0000; z-index: 2; text-shadow: 0 0 100px rgba(255, 0, 0, 0.6); line-height: 1; }
.per-year { font-size: 48px; color: #ff4444; z-index: 2; font-weight: 900; margin-top: -10px; }
.context { font-size: 28px; color: #fff; z-index: 2; margin-top: 25px; font-weight: 900; }
.breakdown { 
  display: flex; 
  gap: 40px; 
  margin-top: 25px; 
  z-index: 2; 
}
.breakdown-item { 
  background: rgba(255,0,0,0.1); 
  border: 2px solid rgba(255,0,0,0.3);
  padding: 15px 25px; 
  border-radius: 12px; 
  text-align: center; 
}
.breakdown-num { font-size: 32px; color: #ff4444; font-weight: 900; }
.breakdown-label { font-size: 14px; color: #888; margin-top: 4px; }
.arrow-down { 
  position: absolute; 
  right: 80px; 
  top: 50%; 
  transform: translateY(-50%); 
  font-size: 120px; 
  color: #ff0000; 
  opacity: 0.3; 
  z-index: 1; 
}
.branding { position: absolute; bottom: 15px; right: 25px; color: #333; font-size: 12px; z-index: 2; }
</style>
</head>
<body>
  <div class="bg-red"></div>
  <div class="arrow-down">↓</div>
  <div class="top-label">If you bet weekly without comparing</div>
  <div class="main-number">-R936</div>
  <div class="per-year">LOST PER YEAR</div>
  <div class="context">That's money you never had to lose.</div>
  <div class="breakdown">
    <div class="breakdown-item">
      <div class="breakdown-num">-R18</div>
      <div class="breakdown-label">Per bet average</div>
    </div>
    <div class="breakdown-item">
      <div class="breakdown-num">×52</div>
      <div class="breakdown-label">Weeks per year</div>
    </div>
    <div class="breakdown-item">
      <div class="breakdown-num">=R936</div>
      <div class="breakdown-label">Gone forever</div>
    </div>
  </div>
  <div class="branding">betsorted.co.za</div>
</body>
</html>
